<svg xmlns="http://www.w3.org/2000/svg" width="220" height="40" viewBox="0 0 220 40" fill="none">
  <defs>
    <linearGradient id="badge-bg" x1="0" y1="0" x2="220" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F1018"/>
      <stop offset="1" stop-color="#06060A"/>
    </linearGradient>
    <linearGradient id="badge-border" x1="0" y1="0" x2="220" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="icon-grad" x1="0" y1="0" x2="16" y2="16" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Border & Background -->
  <rect x="0.5" y="0.5" width="219" height="39" rx="9.5" fill="url(#badge-bg)" stroke="url(#badge-border)"/>

  <!-- Logo Cube Icon -->
  <g transform="translate(12, 10)">
    <rect width="20" height="20" rx="5" fill="url(#icon-grad)" opacity="0.2"/>
    <path d="M10 3L16 6.5L10 10L4 6.5L10 3Z" fill="#06B6D4"/>
    <path d="M4 9.5L10 13L16 9.5M4 12.5L10 16L16 12.5" stroke="#6366F1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Brand Text -->
  <text x="38" y="18" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="-0.2px">
    SchemaCraft<tspan fill="#818CF8">.AI</tspan>
  </text>

  <!-- Verification Pill Text -->
  <text x="38" y="29" fill="#34D399" font-family="'JetBrains Mono', monospace, sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.4px">
    ✓ GEO &amp; AEO VERIFIED
  </text>

  <!-- Live Pulse Dot -->
  <circle cx="204" cy="20" r="3.5" fill="#10B981" opacity="0.9"/>
  <circle cx="204" cy="20" r="6" fill="#10B981" opacity="0.25"/>
</svg>
